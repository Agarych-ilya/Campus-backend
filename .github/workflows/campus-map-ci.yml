name: Campus backend map checks
on:
  push:
    branches: [map]
  pull_request:
    branches: [map]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Headman security and reports
        run: npm test -- --runInBand src/services/attendance/starosta-cabinet.spec.ts
